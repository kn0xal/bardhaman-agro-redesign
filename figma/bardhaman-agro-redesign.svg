<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1640" viewBox="0 0 2400 1640">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102C21"/><stop offset="1" stop-color="#214E38"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F0E5"/><stop offset="1" stop-color="#E7EEE3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#061A10" flood-opacity=".2"/></filter>
    <clipPath id="heroClip"><rect x="1220" y="188" width="720" height="570" rx="38"/></clipPath>
    <style>
      .sans{font-family:Arial,sans-serif}.serif{font-family:Georgia,serif}.mono{font-family:monospace}.ink{fill:#102C21}.muted{fill:#6B815C}.white{fill:#FFFDF7}.lime{fill:#D7EF4A}.gold{fill:#E7B863}.line{stroke:#102C21;stroke-opacity:.16;fill:none}.light-line{stroke:#FFF;stroke-opacity:.2;fill:none}
    </style>
  </defs>
  <!-- cover -->
  <rect width="2400" height="1640" fill="#F4F0E5"/>
  <text x="92" y="105" class="mono muted" font-size="18" letter-spacing="4">CLIENT PRESENTATION / DESIGN DIRECTION 01</text>
  <text x="92" y="290" class="serif ink" font-size="118" font-weight="700">Bardhaman</text>
  <text x="92" y="410" class="serif ink" font-size="118" font-weight="700">Agro Products</text>
  <text x="98" y="490" class="sans muted" font-size="25" letter-spacing="2">FROM BENGAL. TO THE WORLD.</text>
  <rect x="92" y="605" width="760" height="390" rx="32" fill="url(#ink)"/>
  <circle cx="770" cy="660" r="210" fill="#2C6548" opacity=".6"/>
  <circle cx="820" cy="930" r="160" fill="none" stroke="#D7EF4A" stroke-opacity=".42" stroke-width="2"/>
  <text x="140" y="690" class="mono lime" font-size="17" letter-spacing="3">REDESIGN CONCEPT</text>
  <text x="140" y="790" class="serif white" font-size="61" font-weight="700">Rice with a</text>
  <text x="140" y="855" class="serif lime" font-size="61" font-weight="700">sense of place.</text>
  <text x="140" y="920" class="sans white" font-size="19" opacity=".72">A premium, export-first digital home</text>
  <text x="140" y="950" class="sans white" font-size="19" opacity=".72">for the BAPPL grain story.</text>
  <rect x="92" y="1080" width="610" height="1" fill="#102C21" opacity=".18"/>
  <text x="92" y="1130" class="mono muted" font-size="16" letter-spacing="2">VISUAL LANGUAGE</text>
  <text x="92" y="1180" class="sans ink" font-size="24">Liquid glass · field warmth · quiet confidence</text>
  <text x="92" y="1260" class="mono muted" font-size="16" letter-spacing="2">TYPE PAIRING</text>
  <text x="92" y="1310" class="serif ink" font-size="36">Playfair Display + DM Sans + DM Mono</text>

  <!-- homepage board -->
  <rect x="970" y="70" width="1320" height="1460" rx="22" fill="#FFFFFF" stroke="#102C21" stroke-opacity=".15" filter="url(#shadow)"/>
  <rect x="970" y="70" width="1320" height="820" rx="22" fill="url(#ink)"/>
  <text x="1030" y="130" class="sans white" font-size="18" font-weight="700">BAPPL</text>
  <text x="1480" y="130" class="sans white" font-size="14" opacity=".7">OUR STORY　 PRODUCTS　 PROCESS　 GALLERY　 NEWS</text>
  <rect x="2100" y="101" width="120" height="42" rx="21" fill="#D7EF4A"/><text x="2124" y="128" class="sans ink" font-size="13" font-weight="700">TALK TO US ↗</text>
  <text x="1030" y="278" class="mono gold" font-size="14" letter-spacing="3">BARDHAMAN AGRO PRODUCTS · EST. 2001</text>
  <text x="1030" y="400" class="serif white" font-size="70" font-weight="700">Rice with a</text>
  <text x="1030" y="475" class="serif lime" font-size="70" font-weight="700">sense of place.</text>
  <text x="1030" y="538" class="sans white" font-size="18" opacity=".7">From the fertile fields of Bengal to kitchens around</text>
  <text x="1030" y="567" class="sans white" font-size="18" opacity=".7">the world, we grow, mill and move grains that carry trust.</text>
  <rect x="1030" y="630" width="184" height="50" rx="25" fill="#D7EF4A"/><text x="1060" y="661" class="sans ink" font-size="14" font-weight="700">EXPLORE GRAINS ↗</text>
  <rect x="1220" y="188" width="720" height="570" rx="38" fill="#759474"/>
  <image x="1220" y="188" width="720" height="570" preserveAspectRatio="xMidYMid slice" clip-path="url(#heroClip)" xlink:href="../public/assets/director.jpg" opacity=".78"/>
  <rect x="1220" y="188" width="720" height="570" rx="38" fill="#102C21" opacity=".18"/>
  <circle cx="1275" cy="247" r="58" fill="#173D2B" stroke="#D7EF4A" stroke-opacity=".5"/><text x="1243" y="247" class="serif lime" font-size="25">100%</text><text x="1243" y="270" class="mono white" font-size="9">GRAIN INTEGRITY</text>
  <rect x="1880" y="580" width="130" height="190" rx="18" fill="#F4F0E5" transform="rotate(-7 1880 580)"/><image x="1892" y="593" width="106" height="166" preserveAspectRatio="xMidYMid meet" xlink:href="../public/assets/product-biryani.png" transform="rotate(-7 1892 593)"/>
  <rect x="1028" y="744" width="250" height="105" rx="16" fill="url(#glass)" stroke="#FFF" stroke-opacity=".18"/><text x="1050" y="778" class="sans lime" font-size="15" font-weight="700">Built for the next harvest.</text><text x="1050" y="805" class="sans white" font-size="12" opacity=".8">Modern milling, careful sourcing</text><text x="1050" y="824" class="sans white" font-size="12" opacity=".8">and a promise close to the grain.</text>
  <rect x="970" y="890" width="1320" height="145" fill="#16372A"/>
  <text x="1030" y="960" class="mono white" font-size="13" letter-spacing="3" opacity=".8">INDIA　 ●　 UAE　 ●　 OMAN　 ●　 SAUDI ARABIA　 ●　 KUWAIT　 ●　 QATAR</text>
  <rect x="970" y="1035" width="1320" height="495" fill="url(#paper)"/>
  <text x="1030" y="1100" class="mono muted" font-size="14" letter-spacing="3">THE COLLECTION</text>
  <text x="1030" y="1175" class="serif ink" font-size="52" font-weight="700">Grains for every table.</text>
  <rect x="1030" y="1230" width="280" height="240" rx="20" fill="#102C21"/><rect x="1050" y="1250" width="240" height="150" rx="14" fill="#F4F0E5"/><image x="1050" y="1250" width="240" height="150" preserveAspectRatio="xMidYMid meet" xlink:href="../public/assets/product-biryani.png"/><text x="1054" y="1435" class="serif white" font-size="22">Biryani &amp; Ghee</text><text x="1054" y="1457" class="sans white" opacity=".6" font-size="12">PREMIUM · 1 KG</text>
  <rect x="1335" y="1230" width="280" height="240" rx="20" fill="#FFFFFF" stroke="#102C21" stroke-opacity=".12"/><rect x="1355" y="1250" width="240" height="150" rx="14" fill="#F4F0E5"/><image x="1355" y="1250" width="240" height="150" preserveAspectRatio="xMidYMid meet" xlink:href="../public/assets/product-kaima.png"/><text x="1359" y="1435" class="serif ink" font-size="22">Classic Kaima</text><text x="1359" y="1457" class="sans muted" font-size="12">EVERYDAY PREMIUM · 30 KG</text>
  <rect x="1640" y="1230" width="280" height="240" rx="20" fill="#FFFFFF" stroke="#102C21" stroke-opacity=".12"/><rect x="1660" y="1250" width="240" height="150" rx="14" fill="#F4F0E5"/><image x="1660" y="1250" width="240" height="150" preserveAspectRatio="xMidYMid meet" xlink:href="../public/assets/product-jeerakasala.jpg"/><text x="1664" y="1435" class="serif ink" font-size="22">Jeerakasala</text><text x="1664" y="1457" class="sans muted" font-size="12">DOUBLE ROSE · 30 KG</text>
  <rect x="1965" y="1230" width="280" height="240" rx="20" fill="#FFFFFF" stroke="#102C21" stroke-opacity=".12"/><rect x="1985" y="1250" width="240" height="150" rx="14" fill="#F4F0E5"/><image x="1985" y="1250" width="240" height="150" preserveAspectRatio="xMidYMid meet" xlink:href="../public/assets/product-biryani.png"/><text x="1989" y="1435" class="serif ink" font-size="22">Premium Basmati</text><text x="1989" y="1457" class="sans muted" font-size="12">EXPORT SELECTION · 30 KG</text>

  <!-- palette / component notes -->
  <text x="92" y="1430" class="mono muted" font-size="16" letter-spacing="2">COLOUR SYSTEM</text>
  <circle cx="110" cy="1490" r="22" fill="#102C21"/><circle cx="175" cy="1490" r="22" fill="#D7EF4A"/><circle cx="240" cy="1490" r="22" fill="#E7B863"/><circle cx="305" cy="1490" r="22" fill="#F4F0E5"/><circle cx="370" cy="1490" r="22" fill="#E7EEE3"/>
  <text x="110" y="1550" class="mono muted" font-size="12">INK　 LIME　 GOLD　 PAPER　 MOSS</text>
</svg>
